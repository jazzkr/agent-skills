name: Renovate

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Renovate
        uses: renovatebot/github-action@9fea9f0fbf80401026d11d03911d62b1f70fef1f # v46.3.3
        with:
          configurationFile: renovate.json
          # RENOVATE_TOKEN must be a fine-grained PAT scoped to this repository
          # with these permissions: Contents (Read and write), Pull requests
          # (Read and write), Issues (Read and write), Commit statuses
          # (Read and write), Workflows (Read and write), Dependabot alerts
          # (Read-only), Members (Read-only), and Metadata (Read-only).
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
